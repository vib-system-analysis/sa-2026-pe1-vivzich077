services:
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5