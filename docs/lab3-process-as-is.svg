<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">BPMN as-is: обработка HTTP-запроса Test Writer</title>
  <desc id="desc">HTTP-клиент посылает GET и путь. API выбирает корневой маршрут, health либо возвращает 404 для неизвестного пути. Статус и JSON отправляются клиенту.</desc>
  <defs>
    <marker id="sequence" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#404040"/>
    </marker>
    <marker id="message" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#7b4f9d" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #202124; }
      .pool { fill: #fff; stroke: #555; stroke-width: 1.5; }
      .event { fill: #fff; stroke: #333; stroke-width: 2; }
      .end { fill: #fff; stroke: #333; stroke-width: 4; }
      .task { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
      .gateway { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.5; }
      .seq { fill: none; stroke: #404040; stroke-width: 1.7; marker-end: url(#sequence); }
      .msg { fill: none; stroke: #7b4f9d; stroke-width: 1.6; stroke-dasharray: 7 5; marker-end: url(#message); }
      .label { font-size: 15px; font-weight: bold; }
      .task-label { font-size: 14px; text-anchor: middle; }
      .small { font-size: 12px; fill: #444; }
    </style>
  </defs>
  <text x="660" y="32" text-anchor="middle" font-size="21" font-weight="bold">Test Writer — обработка HTTP-запроса (as-is)</text>
  <text x="660" y="55" text-anchor="middle" font-size="13" fill="#555">Наблюдался код прототипа из открытого PR #1 через FastAPI TestClient</text>

  <rect class="pool" x="55" y="78" width="1210" height="92" rx="2"/>
  <rect x="55" y="78" width="38" height="92" fill="#f2f2f2" stroke="#555"/>
  <text transform="translate(80 155) rotate(-90)" class="label">Клиент</text>
  <text x="118" y="125" class="label">Внешний HTTP-клиент</text>
  <text x="118" y="147" class="small">Отправляет HTTP-метод и путь; конкретный инициатор кодом не определён</text>

  <rect class="pool" x="55" y="205" width="1210" height="370" rx="2"/>
  <rect x="55" y="205" width="38" height="370" fill="#f3edf6" stroke="#555"/>
  <text transform="translate(80 475) rotate(-90)" class="label">Test Writer API</text>

  <circle class="event" cx="172" cy="385" r="18"/>
  <text x="172" y="423" class="small" text-anchor="middle">GET получен</text>
  <polygon class="gateway" points="320,355 350,385 320,415 290,385"/>
  <path d="M313 378 L327 392 M327 378 L313 392" stroke="#333" stroke-width="2"/>
  <text x="320" y="445" class="small" text-anchor="middle">Путь?</text>
  <path class="seq" d="M190 385 H290"/>

  <rect class="task" x="495" y="255" width="300" height="62" rx="10"/>
  <text x="645" y="280" class="task-label">
    <tspan x="645" dy="0">GET /</tspan>
    <tspan x="645" dy="19">вернуть name и status=stub</tspan>
  </text>
  <rect class="task" x="495" y="354" width="300" height="62" rx="10"/>
  <text x="645" y="379" class="task-label">
    <tspan x="645" dy="0">GET /health</tspan>
    <tspan x="645" dy="19">вернуть status=ok</tspan>
  </text>
  <rect class="task" x="495" y="453" width="300" height="62" rx="10"/>
  <text x="645" y="478" class="task-label">
    <tspan x="645" dy="0">Другой путь</tspan>
    <tspan x="645" dy="19">стандартный ответ FastAPI 404</tspan>
  </text>

  <path class="seq" d="M330 362 V286 H495"/>
  <text x="395" y="278" class="small">path = /</text>
  <path class="seq" d="M350 385 H495"/>
  <text x="407" y="376" class="small">/health</text>
  <path class="seq" d="M330 408 V484 H495"/>
  <text x="384" y="475" class="small">иначе</text>

  <circle class="end" cx="900" cy="286" r="18"/>
  <circle class="end" cx="900" cy="385" r="18"/>
  <circle class="end" cx="900" cy="484" r="18"/>
  <text x="930" y="280" class="small">HTTP 200</text>
  <text x="930" y="297" class="small">{name: ai-test-writer, status: stub}</text>
  <text x="930" y="379" class="small">HTTP 200</text>
  <text x="930" y="396" class="small">{status: ok}</text>
  <text x="930" y="478" class="small">HTTP 404</text>
  <text x="930" y="495" class="small">{detail: Not Found}</text>
  <path class="seq" d="M795 286 H882"/>
  <path class="seq" d="M795 385 H882"/>
  <path class="seq" d="M795 484 H882"/>

  <path class="msg" d="M172 170 V366"/>
  <text x="102" y="190" class="small" fill="#7b4f9d">GET + path</text>
  <path class="msg" d="M918 286 H1195 V170"/>
  <path class="msg" d="M918 385 H1220 V170"/>
  <path class="msg" d="M918 484 H1245 V170"/>
  <text x="1180" y="193" class="small" fill="#7b4f9d">статус + JSON</text>

  <text x="660" y="605" text-anchor="middle" font-size="12" fill="#555">Задача/багрепорт не читается; генерации теста, runner и создания PR в наблюдаемой реализации нет.</text>
</svg>
