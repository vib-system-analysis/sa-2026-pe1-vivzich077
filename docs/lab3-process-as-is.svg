<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Test Writer: подтверждённый as-is процесс HTTP-заглушки</title>
  <desc id="desc">Разработчик или QA отправляет HTTP-запрос, HTTP-заглушка Test Writer его обрабатывает и возвращает HTTP-ответ. Детали не подтверждены живым прогоном.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="message-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#9673a6" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #222; }
      .lane-label { font-size: 15px; font-weight: bold; }
      .box-label { font-size: 14px; text-anchor: middle; }
      .detail { font-size: 11px; fill: #444; }
    </style>
  </defs>
  <text x="550" y="34" text-anchor="middle" font-size="21" font-weight="bold">Test Writer — подтверждённый as-is (HTTP-заглушка)</text>
  <text x="550" y="57" text-anchor="middle" font-size="13" fill="#555">Детали запроса и ответа не подтверждены живым прогоном</text>

  <rect x="40" y="90" width="1020" height="105" fill="#f5f5f5" stroke="#666"/>
  <rect x="40" y="90" width="40" height="105" fill="#e8e8e8" stroke="#666"/>
  <text class="lane-label" transform="translate(66 183) rotate(-90)">Разработчик / QA</text>
  <rect x="40" y="220" width="1020" height="150" fill="#f3edf6" stroke="#9673a6"/>
  <rect x="40" y="220" width="40" height="150" fill="#e6dcec" stroke="#9673a6"/>
  <text class="lane-label" transform="translate(66 357) rotate(-90)">Test Writer (доступная часть)</text>

  <circle cx="145" cy="142" r="17" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <line x1="162" y1="142" x2="221" y2="142" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="230,117 440,117 450,167 240,167" fill="#fff2cc" stroke="#d6b656"/>
  <text class="box-label" x="340" y="137">HTTP-запрос</text>
  <text class="detail" x="340" y="154" text-anchor="middle">контракт не установлен</text>

  <path d="M340 167 V260 H485" fill="none" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#message-arrow)"/>
  <rect x="495" y="255" width="250" height="72" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="box-label" x="620" y="284">Обработка HTTP-заглушкой</text>
  <text class="detail" x="620" y="304" text-anchor="middle">бизнес-логика не подтверждена</text>

  <path d="M745 291 H790 V142 H805" fill="none" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#message-arrow)"/>
  <polygon points="815,117 1025,117 1035,167 825,167" fill="#fff2cc" stroke="#d6b656"/>
  <text class="box-label" x="925" y="137">HTTP-ответ</text>
  <text class="detail" x="925" y="154" text-anchor="middle">payload и ошибки неизвестны</text>
  <line x1="815" y1="142" x2="789" y2="142" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="770" cy="142" r="16" fill="#f8cecc" stroke="#b85450" stroke-width="4"/>

  <path d="M300 393 H1040 L1025 448 H285 Z" fill="#fff2cc" stroke="#d6b656"/>
  <text x="315" y="416" font-size="13">Не реализованы: уточнение задачи, чтение репозитория, генерация теста, валидация,</text>
  <text x="315" y="435" font-size="13">изолированный запуск и подготовка PR.</text>
</svg>
